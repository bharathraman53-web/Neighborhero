$kind: http-request
description: Signals that the helper has arrived and begun the task. Idempotent call that verifies task readiness.
url: "{{baseUrl}}/tasks/{{taskId}}/confirm-start"
method: POST
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK (or 400 if invalid transition)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 400, 404]);
      });
    language: text/javascript
order: 2000
