$kind: http-request
description: Retrieves all community help requests created by the authenticated user.
url: "{{baseUrl}}/requests/my/posted"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns list of requests posted by current user", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data).to.be.an("array");
      });
    language: text/javascript
order: 4000
