$kind: http-request
description: Fetches chronological community task history for the authenticated user, derived from real database records.
url: "{{baseUrl}}/safety/task-history"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Returns user real task history array", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data).to.be.an("array");
      });
    language: text/javascript
order: 1000
