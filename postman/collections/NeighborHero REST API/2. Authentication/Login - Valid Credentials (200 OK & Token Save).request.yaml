$kind: http-request
description: Authenticates a user using email or 10-digit phone number. Automatically captures the 64-character bearer token into the environment variable {{token}}.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email_or_phone": "{{testEmail}}",
        "password": "{{testPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Login returns bearer token and saves to environment", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data).to.have.property("token");
          pm.expect(jsonData.data.token).to.not.be.empty;
          pm.environment.set("token", jsonData.data.token);
      });
    language: text/javascript
order: 3000
