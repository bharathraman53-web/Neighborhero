$kind: http-request
description: Verifies constant-time authentication error handling. Returns HTTP 401 with a user-friendly error message without leaking account existence.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email_or_phone": "{{testEmail}}",
        "password": "WrongPassword999!"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });
      pm.test("Returns user-friendly error message", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.false;
          pm.expect(jsonData.message).to.eql("Incorrect email or phone number, or password. Please try again.");
      });
    language: text/javascript
order: 4000
