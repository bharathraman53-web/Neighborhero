$kind: http-request
description: Sends a private message to a neighbor. Dispatches an in-app notification to the recipient and returns the created message record.
url: "{{baseUrl}}/chat/messages"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "message_text": "Hello neighbor! I am on my way to help you.",
        "recipient_id": "{{helperId}}",
        "conversation_id": "{{conversationId}}",
        "client_message_id": "postman_msg_1793334366"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created (or 404/400 if recipient missing)", function () {
          pm.expect(pm.response.code).to.be.oneOf([201, 400, 404]);
      });
      if (pm.response.code === 201) {
          var jsonData = pm.response.json();
          pm.test("Message sent with conversation_id", function () {
              pm.expect(jsonData.success).to.be.true;
              pm.expect(jsonData.data.message_text).to.include("Hello neighbor");
              if (jsonData.data.conversation_id) {
                  pm.environment.set("conversationId", jsonData.data.conversation_id);
              }
          });
      }
    language: text/javascript
order: 3000
