$kind: http-request
name: Get Current User Profile (auth/me)
description: Fetches the authenticated user profile using the Bearer token in the Authorization header.
url: "{{baseUrl}}/auth/me"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Profile includes identity, verified status, and points", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.success).to.be.true;
          pm.expect(jsonData.data).to.have.property("id");
          pm.expect(jsonData.data).to.have.property("full_name");
          pm.expect(jsonData.data).to.have.property("points");
          pm.expect(jsonData.data).to.have.property("rating");
      });
    language: text/javascript
order: 1000
