<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = {darkMode: "class",theme: {extend: {colors: {"tertiary-fixed-dim": "#f5b7b4", "secondary": "#116c4a", "surface-dim": "#d7dadf", "surface-container-high": "#e5e8ee", "tertiary": "#401b1b", "surface-tint": "#3f6653", "on-tertiary-fixed": "#331111", "surface-container-low": "#f1f4f9", "on-tertiary-container": "#d29895", "surface-variant": "#e0e3e8", "background": "#f7f9ff", "surface-bright": "#f7f9ff", "tertiary-fixed": "#ffdad8", "tertiary-container": "#5a302f", "on-error": "#ffffff", "surface-container-highest": "#e0e3e8", "secondary-fixed": "#a1f4c8", "on-surface-variant": "#414844", "secondary-container": "#a1f4c8", "on-surface": "#181c20", "on-tertiary-fixed-variant": "#673a39", "inverse-on-surface": "#eef1f6", "outline-variant": "#c1c8c2", "primary-container": "#1b4332", "primary-fixed-dim": "#a5d0b9", "on-primary": "#ffffff", "surface": "#f7f9ff", "primary-fixed": "#c1ecd4", "inverse-primary": "#a5d0b9", "on-primary-fixed-variant": "#274e3d", "primary": "#012d1d", "on-primary-container": "#86af99", "on-error-container": "#93000a", "error": "#ba1a1a", "on-secondary-container": "#1b724f", "on-tertiary": "#ffffff", "surface-container-lowest": "#ffffff", "error-container": "#ffdad6", "on-secondary-fixed": "#002113", "outline": "#717973", "on-secondary-fixed-variant": "#005236", "on-primary-fixed": "#002114", "secondary-fixed-dim": "#86d7ad", "on-secondary": "#ffffff", "surface-container": "#ebeef3", "inverse-surface": "#2d3135", "on-background": "#181c20"},borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},spacing: {"space-sm": "0.5rem", "space-lg": "1.5rem", "gutter": "1rem", "margin": "1rem", "space-md": "1rem", "space-xs": "0.25rem", "space-xl": "2rem"},fontFamily: {"headline-lg": ["Plus Jakarta Sans"], "label-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-lg": ["Inter"]},fontSize: {"headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}], "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}], "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}], "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "600"}], "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}], "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]}}}};</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface font-body flex flex-col min-h-screen text-on-surface"><main class="flex flex-col relative w-full px-gutter pt-safe pb-safe bg-surface flex-grow"><div class="flex flex-col w-full items-center justify-center py-space-xl max-w-md mx-auto">
<!-- Brand & Welcome Hero -->
<div class="flex flex-col items-center text-center mb-space-lg">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary mb-space-md shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">volunteer_activism</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-space-xs">Welcome back, Neighbor!</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your community is glad you're back.</p>
</div>
<!-- Neighborhood Pulse Pill -->
<div class="bg-surface-container-low px-4 py-2 rounded-full flex items-center gap-space-sm mb-space-lg shadow-sm">
<span class="w-2 h-2 rounded-full bg-secondary animate-pulse"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant">14 trusted helpers online in your block</span>
</div>
<!-- Login Card Container (No borders, pure background & shadow structure) -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-md flex flex-col gap-space-md">
<!-- Email / Phone Input -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant">Email or Phone Number</label>
<div class="bg-surface-container-low rounded-xl px-space-md py-3 flex items-center gap-space-sm focus-within:ring-2 focus-within:ring-secondary transition-all">
<span class="material-symbols-outlined text-outline text-xl">alternate_email</span>
<input class="bg-transparent w-full font-body-md text-body-md text-on-surface outline-none placeholder:text-outline-variant" placeholder="name@example.com or phone" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant">Password</label>
<a class="font-label-md text-label-md text-secondary hover:underline" href="#">Forgot password?</a>
</div>
<div class="bg-surface-container-low rounded-xl px-space-md py-3 flex items-center gap-space-sm focus-within:ring-2 focus-within:ring-secondary transition-all">
<span class="material-symbols-outlined text-outline text-xl">lock</span>
<input class="bg-transparent w-full font-body-md text-body-md text-on-surface outline-none placeholder:text-outline-variant" id="password-input" placeholder="••••••••" type="password"/>
<button class="text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-xl" id="toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Remember Me Checkbox -->
<div class="flex items-center gap-space-sm py-space-xs">
<input class="w-4 h-4 rounded accent-primary cursor-pointer" id="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer select-none" for="remember">Remember this device for 30 days</label>
</div>
<!-- Primary Log In Button -->
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-3.5 rounded-xl shadow-sm hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm mt-space-sm" onclick="handleLogin(event)">
<span>Log In</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</div>
<!-- Create Account Footer -->
<div class="flex items-center gap-space-xs mt-space-lg text-center">
<span class="font-body-md text-body-md text-on-surface-variant">New to NeighborHero?</span>
<a class="font-label-lg text-label-lg text-secondary font-semibold hover:underline" href="#">Create Account</a>
</div>
<!-- Success Toast (Hidden by default) -->
<div class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-primary-container text-on-primary-container px-5 py-3 rounded-xl shadow-xl flex items-center gap-space-sm transition-all duration-300 translate-y-20 opacity-0 pointer-events-none" id="success-toast">
<span class="material-symbols-outlined text-secondary-fixed" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-label-md text-label-md text-on-primary">Welcome back! Connecting to your block...</span>
</div>
</div>
<script>
  function togglePassword() {
    const input = document.getElementById('password-input');
    const icon = document.getElementById('toggle-icon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleLogin(e) {
    const toast = document.getElementById('success-toast');
    toast.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
    toast.classList.add('translate-y-0', 'opacity-100');
    setTimeout(() => {
      toast.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none');
      toast.classList.remove('translate-y-0', 'opacity-100');
    }, 3000);
  }
</script></main></body></html>
