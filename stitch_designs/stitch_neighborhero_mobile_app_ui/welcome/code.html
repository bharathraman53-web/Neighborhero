</head><body class="bg-surface font-body flex flex-col min-h-screen text-on-surface"><main class="flex flex-col relative w-full px-gutter pt-safe pb-safe bg-surface flex-grow"><div class="flex flex-col w-full justify-between pb-8 pt-4">
<!-- Top Branding / Welcome header -->
<div class="flex flex-col items-center text-center px-gutter pt-space-lg">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-primary mb-space-md shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">handshake</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-space-xs">NeighborHero</h1>
<p class="font-body-md text-on-surface-variant max-w-xs">Connecting friendly neighbors for everyday help, local support, and stronger community bonds.</p>
</div>
<!-- Hero Illustration / Visual -->
<div class="my-space-xl px-gutter">
<div class="relative w-full h-72 rounded-xl overflow-hidden bg-surface-container-high shadow-md">
<div class="w-full h-full bg-cover bg-center" data-alt="A warm, charming illustration of friendly diverse neighbors helping each other in a sunny suburban community park, featuring soft forest greens, warm cream tones, gentle smiles, carrying grocery bags and planting flowers, vibrant tactile aesthetic, cozy and safe mood" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDugjQ2RY9HF5fLJEWRA2B65Dm2F9driH5UjbVIv1bcGaCUjhlPW_xUm2pZsuznQzjCM-jvN2UI8xnLKgFB-hbEJKaeTnGrKfDEf-czXRv2Vz0Y0dfMK-mYO4awETqI5OUSsVy1S-z5DdUeuqqxB_CmVqvrVmem9E356nFaiyEuzF1_I5D2Vol93mPh12E329JuoxFftFGDQ3EP-bgzvWJQ8SmkIJjLzQZIQNwH7v3r-gBcNCJiPZMHSw')"></div>
<div class="absolute inset-0 bg-gradient-to-t from-primary/30 via-transparent to-transparent"></div>
<div class="absolute bottom-4 left-4 right-4 bg-surface/90 backdrop-blur-md p-3 rounded-lg flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">verified</span>
</div>
<div class="flex flex-col">
<span class="font-label-md text-on-surface">Trusted Local Network</span>
<span class="font-body-sm text-on-surface-variant">Over 1,200 neighbors active near you</span>
</div>
</div>
</div>
</div>
<!-- Interactive Action Area with Delightful Details -->
<div class="flex flex-col gap-space-md px-gutter">
<button class="w-full py-4 px-space-lg rounded-full bg-primary text-on-primary font-label-lg flex items-center justify-center gap-space-sm shadow-md active:scale-95 transition-transform" onclick="handleGetStarted()">
<span>Get Started</span>
<span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
<button class="w-full py-4 px-space-lg rounded-full bg-surface-container-low text-primary font-label-lg flex items-center justify-center gap-space-sm active:scale-95 transition-transform" onclick="handleLogin()">
<span>Login</span>
</button>
<p class="text-center font-body-sm text-on-surface-variant mt-space-sm">
      By continuing, you agree to NeighborHero's <a class="underline text-primary" href="#">Community Guidelines</a>.
    </p>
</div>
</div>
<script>
  function handleGetStarted() {
    const btn = event.currentTarget;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg">progress_activity</span><span>Loading...</span>';
    setTimeout(() => {
      btn.innerHTML = '<span>Welcome Aboard! 🎉</span>';
    }, 800);
  }

  function handleLogin() {
    const btn = event.currentTarget;
    btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
    setTimeout(() => {
      btn.classList.remove('bg-secondary-container', 'text-on-secondary-container');
    }, 600);
  }
</script></main></body></html>
