<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = {darkMode: "class",theme: {extend: {colors: {"tertiary-fixed-dim": "#f5b7b4", "secondary": "#116c4a", "surface-dim": "#d7dadf", "surface-container-high": "#e5e8ee", "tertiary": "#401b1b", "surface-tint": "#3f6653", "on-tertiary-fixed": "#331111", "surface-container-low": "#f1f4f9", "on-tertiary-container": "#d29895", "surface-variant": "#e0e3e8", "background": "#f7f9ff", "surface-bright": "#f7f9ff", "tertiary-fixed": "#ffdad8", "tertiary-container": "#5a302f", "on-error": "#ffffff", "surface-container-highest": "#e0e3e8", "secondary-fixed": "#a1f4c8", "on-surface-variant": "#414844", "secondary-container": "#a1f4c8", "on-surface": "#181c20", "on-tertiary-fixed-variant": "#673a39", "inverse-on-surface": "#eef1f6", "outline-variant": "#c1c8c2", "primary-container": "#1b4332", "primary-fixed-dim": "#a5d0b9", "on-primary": "#ffffff", "surface": "#f7f9ff", "primary-fixed": "#c1ecd4", "inverse-primary": "#a5d0b9", "on-primary-fixed-variant": "#274e3d", "primary": "#012d1d", "on-primary-container": "#86af99", "on-error-container": "#93000a", "error": "#ba1a1a", "on-secondary-container": "#1b724f", "on-tertiary": "#ffffff", "surface-container-lowest": "#ffffff", "error-container": "#ffdad6", "on-secondary-fixed": "#002113", "outline": "#717973", "on-secondary-fixed-variant": "#005236", "on-primary-fixed": "#002114", "secondary-fixed-dim": "#86d7ad", "on-secondary": "#ffffff", "surface-container": "#ebeef3", "inverse-surface": "#2d3135", "on-background": "#181c20"},borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},spacing: {"space-sm": "0.5rem", "space-lg": "1.5rem", "gutter": "1rem", "margin": "1rem", "space-md": "1rem", "space-xs": "0.25rem", "space-xl": "2rem"},fontFamily: {"headline-lg": ["Plus Jakarta Sans"], "label-md": ["Inter"], "body-sm": ["Inter"], "body-md": ["Inter"], "body-lg": ["Inter"], "label-sm": ["Inter"], "headline-md": ["Plus Jakarta Sans"], "headline-sm": ["Plus Jakarta Sans"], "label-lg": ["Inter"]},fontSize: {"headline-lg": ["28px", {"lineHeight": "36px", "fontWeight": "700"}], "label-md": ["12px", {"lineHeight": "16px", "fontWeight": "500"}], "body-sm": ["12px", {"lineHeight": "16px", "fontWeight": "400"}], "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}], "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}], "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}], "headline-md": ["22px", {"lineHeight": "28px", "fontWeight": "600"}], "headline-sm": ["18px", {"lineHeight": "24px", "fontWeight": "600"}], "label-lg": ["14px", {"lineHeight": "20px", "fontWeight": "500"}]}}}};</script><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head><body class="bg-surface font-body flex flex-col min-h-screen text-on-surface"><main class="flex flex-col relative w-full px-gutter pt-safe pb-safe bg-surface flex-grow"><div class="flex flex-col w-full pb-8">
<!-- Warm Greeting & Character Header -->
<div class="flex flex-col items-center text-center py-space-lg mb-space-md">
<div class="w-16 h-16 rounded-full bg-primary-fixed flex items-center justify-center text-on-primary-fixed mb-space-md shadow-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-space-xs">Join NeighborHero</h1>
<p class="font-body-md text-on-surface-variant max-w-[280px]">Connect with verified helpers, lend a hand, and make your community safer together.</p>
</div>
<!-- Registration Card Container (Surface Level 1) -->
<div class="bg-surface-container-lowest rounded-xl p-space-lg shadow-[0px_4px_12px_rgba(27,67,50,0.06)] mb-space-lg">
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault(); triggerDelightfulSuccess();">
<!-- Full Name -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant" for="fullname">Full Name</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-xl">person</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary transition-all" id="fullname" placeholder="e.g. Sarah Jenkins" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-xl">mail</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary transition-all" id="email" placeholder="sarah@example.com" required="" type="email"/>
</div>
</div>
<!-- Phone -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant" for="phone">Phone Number</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-xl">call</span>
<input class="w-full pl-10 pr-4 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary transition-all" id="phone" placeholder="(555) 000-0000" required="" type="tel"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant" for="password">Create Password</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-xl">lock</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary transition-all" id="password" placeholder="At least 8 characters" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface" onclick="togglePasswordVisibility('password', this)" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-on-surface-variant" for="confirm-password">Confirm Password</label>
<div class="relative flex items-center">
<span class="absolute left-3 material-symbols-outlined text-outline text-xl">lock_reset</span>
<input class="w-full pl-10 pr-12 py-3 bg-surface-container-low rounded-lg font-body-md text-on-surface outline-none focus:ring-2 focus:ring-secondary transition-all" id="confirm-password" placeholder="Re-enter your password" required="" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface" onclick="togglePasswordVisibility('confirm-password', this)" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Terms Agreement Checkbox -->
<div class="flex items-start gap-space-sm pt-space-xs">
<div class="flex items-center h-6">
<input class="w-5 h-5 accent-secondary rounded cursor-pointer" id="terms" required="" type="checkbox"/>
</div>
<label class="font-body-sm text-on-surface-variant cursor-pointer select-none" for="terms">
          I agree to NeighborHero's <a class="text-secondary font-medium underline" href="#">Community Guidelines</a> and <a class="text-secondary font-medium underline" href="#">Terms of Service</a>.
        </label>
</div>
<!-- Sign Up Button -->
<button class="w-full mt-space-sm py-4 bg-primary text-on-primary rounded-full font-label-lg shadow-md hover:bg-primary/95 active:scale-[0.98] transition-all flex items-center justify-center gap-space-sm" type="submit">
<span>Sign Up as NeighborHero</span>
<span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
</form>
</div>
<!-- Already have an account link -->
<div class="flex items-center justify-center gap-space-xs pb-space-lg">
<span class="font-body-md text-on-surface-variant">Already have an account?</span>
<a class="font-label-lg text-secondary font-semibold hover:underline" href="#">Log In</a>
</div>
<!-- Success celebration toast (Hidden by default) -->
<div class="fixed inset-x-4 bottom-8 bg-primary text-on-primary p-space-md rounded-xl shadow-xl flex items-center gap-space-md translate-y-32 opacity-0 transition-all duration-300 z-50" id="success-toast">
<div class="w-10 h-10 rounded-full bg-secondary flex items-center justify-center">
<span class="material-symbols-outlined text-on-secondary" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
<div class="flex flex-col flex-grow">
<span class="font-headline-sm text-on-primary">Welcome to the neighborhood!</span>
<span class="font-body-sm text-primary-fixed-dim">Account created successfully. Setting up your profile...</span>
</div>
</div>
<script>
    function togglePasswordVisibility(fieldId, btn) {
      const input = document.getElementById(fieldId);
      const icon = btn.querySelector('.material-symbols-outlined');
      if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        input.type = 'password';
        icon.textContent = 'visibility';
      }
    }

    function triggerDelightfulSuccess() {
      const toast = document.getElementById('success-toast');
      toast.classList.remove('translate-y-32', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      
      // Simulate redirection
      setTimeout(() => {
        // Mock action
      }, 2500);
    }
  </script>
</div></main></body></html>
